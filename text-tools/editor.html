<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤문 에디터 · Copy Editor</title>
<!--
  윤문(문체 교정) 전용 에디터. 자체 완결 단일 HTML — 열기만 하면 동작.
  구조: 각 항목마다  [원문(읽기전용)]  +  바로 아래 [편집 박스(원문 복사, 여기서 수정)].
  무엇이 바뀌었는지 글자 단위 diff로 표시 → 작업자·의뢰자 모두 변경점 확인.
  입력: (a) EN/KO 시트(text-tools/portfolio_text.txt 포맷) 자동 인식, (b) 임의 텍스트 붙여넣기.
  출력: 시트 재작성(→ apply.py로 반영) · 편집본만 복사 · 변경 리포트.
-->
<style>
:root{
  --bg:#0A0E0F; --panel:#12191C; --panel2:#161F22; --line:rgba(232,240,238,.10);
  --line2:rgba(232,240,238,.18); --ink:#ECEFEC; --muted:#93A09D; --faint:#5D6A67;
  --gold:#E6B15E; --gold2:#F2C982; --teal:#57B7C1; --ins:#7FC29B; --del:#E0736B;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;padding-bottom:78px;}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;}
textarea,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;width:100%;}
textarea:focus,input:focus{outline:0;border-color:var(--gold);}
textarea{resize:vertical;line-height:1.65;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px;}

header{position:sticky;top:0;z-index:20;background:rgba(10,14,15,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.head-in{max-width:900px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.head-in h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.head-in h1 b{color:var(--gold);}
.head-in .sub{font-size:12px;color:var(--faint);flex:1;min-width:120px;}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);}
.sw{width:38px;height:22px;border-radius:100px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:background .2s,border-color .2s;flex:0 0 auto;}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:transform .2s,background .2s;}
.sw.on{background:rgba(230,177,94,.2);border-color:var(--gold);}
.sw.on::after{transform:translateX(16px);background:var(--gold);}

.load{margin:22px 0;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;}
.load h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;font-weight:600;}
.load .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.btn{font-size:13px;font-weight:600;padding:9px 16px;border-radius:100px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s;}
.btn-fill{background:var(--gold);color:#12100A;}.btn-fill:hover{background:var(--gold2);}
.btn-ghost{border:1px solid var(--line2);color:var(--ink);}.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{font-size:12px;padding:7px 13px;}
.hint{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6;}
label.file{display:inline-block;}
label.file input{display:none;}

.seg{margin:14px 0;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;}
.seg.changed{border-color:rgba(230,177,94,.4);}
.seg .id{position:absolute;top:14px;right:16px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.06em;}
.seg .id .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:7px;vertical-align:middle;opacity:0;}
.seg.changed .id .dot{opacity:1;}
.seg .ref{font-size:12.5px;color:var(--faint);line-height:1.55;margin-bottom:8px;padding-left:11px;border-left:2px solid var(--line2);}
.seg .ref .lang{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-right:8px;font-weight:600;}
.seg .orig{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:10px;white-space:pre-wrap;}
.seg .orig .lab,.seg .edit-lab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;display:block;margin-bottom:5px;}
.seg .edit-lab{color:var(--gold);}
.seg textarea{min-height:52px;}
.seg .diff{margin-top:10px;font-size:13.5px;line-height:1.7;padding:10px 12px;background:var(--panel2);border-radius:8px;display:none;white-space:pre-wrap;}
.seg.changed .diff.show{display:block;}
.diff ins{background:rgba(127,194,155,.18);color:var(--ins);text-decoration:none;border-radius:3px;padding:0 1px;}
.diff del{background:rgba(224,115,107,.14);color:var(--del);border-radius:3px;padding:0 1px;}
.seg .revert{position:absolute;bottom:14px;right:16px;font-size:11.5px;color:var(--faint);display:none;}
.seg.changed .revert{display:inline;}
.seg .revert:hover{color:var(--gold);}

.empty{text-align:center;color:var(--faint);padding:50px 20px;font-size:14px;line-height:1.7;}

footer{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(13,19,21,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
.foot-in{max-width:900px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.stat{font-size:13px;color:var(--muted);flex:1;min-width:140px;}
.stat b{color:var(--gold);font-variant-numeric:tabular-nums;}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:9px 18px;border-radius:100px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;}
.toast.on{opacity:1;}
</style>
</head>
<body>
<header><div class="head-in">
  <h1>윤문 <b>에디터</b></h1>
  <span class="sub">원문 아래 박스에서 문체만 고치세요 · 변경점은 diff로 표시</span>
  <button class="toggle" id="diffToggle"><span class="sw on" id="sw"></span>변경점 보기</button>
</div></header>

<div class="wrap">
  <div class="load" id="loadPanel">
    <h2>텍스트 불러오기</h2>
    <textarea id="paste" rows="4" placeholder="여기에 텍스트를 붙여넣으세요.

· EN/KO 시트(text-tools/portfolio_text.txt)를 붙이면 자동 인식 → EN은 참고, KO를 편집
· 그 외 일반 텍스트는 줄 또는 문단 단위로 분리"></textarea>
    <div class="btns">
      <button class="btn btn-fill btn-sm" id="loadSheet">EN/KO 시트로 불러오기</button>
      <button class="btn btn-ghost btn-sm" id="loadLines">줄 단위</button>
      <button class="btn btn-ghost btn-sm" id="loadParas">문단 단위</button>
      <label class="file btn btn-ghost btn-sm">.txt 파일<input type="file" id="fileIn" accept=".txt,.md,text/plain"></label>
      <button class="btn btn-ghost btn-sm" id="sample" style="margin-left:auto">샘플</button>
    </div>
    <div class="hint" id="hint">붙여넣고 형식을 고르면 아래에 항목별 편집 박스가 생깁니다. 편집 내용은 이 브라우저에 자동 저장됩니다.</div>
  </div>

  <div id="segs"></div>
  <div class="empty" id="empty">위에 텍스트를 붙여넣어 시작하세요.</div>
</div>

<footer><div class="foot-in">
  <div class="stat" id="stat">—</div>
  <button class="btn btn-ghost btn-sm" id="expChanges">변경 리포트</button>
  <button class="btn btn-ghost btn-sm" id="expSheet">시트로 내보내기</button>
  <button class="btn btn-fill btn-sm" id="expEdited">편집본 복사</button>
</div></footer>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
let MODE="none";      // 'sheet' | 'lines' | 'paras'
let SEGS=[];          // {id, ref, orig, edited}
let SHOWDIFF=true;
const KEY="humanize-editor-v1";

/* ---------- diff (char-level LCS) ---------- */
function diffChars(a,b){
  if(a===b) return [{t:'eq',s:a}];
  const n=a.length,m=b.length;
  if(n*m>400000){ // fallback: whole replace for very long inputs
    return [{t:'del',s:a},{t:'ins',s:b}];
  }
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[];let i=0,j=0;
  const push=(t,ch)=>{const l=ops[ops.length-1];if(l&&l.t===t)l.s+=ch;else ops.push({t,s:ch});};
  while(i<n&&j<m){
    if(a[i]===b[j]){push('eq',a[i]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){push('del',a[i]);i++;}
    else{push('ins',b[j]);j++;}
  }
  while(i<n){push('del',a[i]);i++;}
  while(j<m){push('ins',b[j]);j++;}
  return ops;
}
function esc(s){return(s==null?"":String(s)).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function renderDiff(a,b){
  return diffChars(a,b).map(o=>o.t==='eq'?esc(o.s):o.t==='ins'?`<ins>${esc(o.s)}</ins>`:`<del>${esc(o.s)}</del>`).join("");
}

/* ---------- parse ---------- */
function parseSheet(txt){
  const out=[];let cur=null;
  txt.split(/\r?\n/).forEach(line=>{
    if(/^\[.+\]$/.test(line.trim())){cur={id:line.trim().slice(1,-1),ref:"",orig:""};out.push(cur);}
    else if(line.startsWith("EN\t")&&cur)cur.ref=line.slice(3);
    else if(line.startsWith("KO\t")&&cur)cur.orig=line.slice(3);
  });
  return out.filter(x=>x.orig!=="").map(x=>({...x,edited:x.orig}));
}
function parsePlain(txt,mode){
  const parts=mode==="paras"?txt.split(/\n\s*\n/):txt.split(/\r?\n/);
  return parts.map(s=>s.trim()).filter(Boolean)
    .map((s,i)=>({id:String(i+1).padStart(3,"0"),ref:"",orig:s,edited:s}));
}
function looksLikeSheet(txt){return /^\[.+\]\s*$/m.test(txt)&&/^KO\t/m.test(txt);}

/* ---------- state ---------- */
function load(mode,txt){
  txt=(txt!=null?txt:$("#paste").value)||"";
  if(!txt.trim()){toast("붙여넣은 텍스트가 없습니다");return;}
  if(mode==="sheet"){SEGS=parseSheet(txt);MODE="sheet";}
  else{SEGS=parsePlain(txt,mode);MODE=mode;}
  if(!SEGS.length){toast("항목을 찾지 못했습니다");return;}
  persist();render();toast(`${SEGS.length}개 항목 불러옴`);
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({MODE,SEGS}));}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.SEGS&&d.SEGS.length){MODE=d.MODE;SEGS=d.SEGS;return true;}}catch(e){}return false;}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1600);}

/* ---------- render ---------- */
function render(){
  const box=$("#segs");box.innerHTML="";
  $("#empty").style.display=SEGS.length?"none":"block";
  SEGS.forEach((s,idx)=>{
    const changed=s.edited!==s.orig;
    const seg=el("div","seg"+(changed?" changed":""));
    seg.innerHTML=`
      <div class="id">${esc(s.id)}<span class="dot"></span></div>
      ${s.ref?`<div class="ref"><span class="lang">EN 참고</span>${esc(s.ref)}</div>`:""}
      <div class="orig"><span class="lab">원문</span>${esc(s.orig)}</div>
      <span class="edit-lab">편집</span>
      <textarea rows="2"></textarea>
      <div class="diff${SHOWDIFF?" show":""}"></div>
      <button class="revert">↺ 되돌리기</button>`;
    const ta=seg.querySelector("textarea");
    ta.value=s.edited;
    autosize(ta);
    const diffEl=seg.querySelector(".diff");
    if(changed)diffEl.innerHTML=renderDiff(s.orig,s.edited);
    ta.addEventListener("input",()=>{
      s.edited=ta.value;autosize(ta);
      const ch=s.edited!==s.orig;
      seg.classList.toggle("changed",ch);
      diffEl.innerHTML=ch?renderDiff(s.orig,s.edited):"";
      persist();updateStat();
    });
    seg.querySelector(".revert").onclick=()=>{s.edited=s.orig;ta.value=s.orig;autosize(ta);seg.classList.remove("changed");diffEl.innerHTML="";persist();updateStat();};
    box.appendChild(seg);
  });
  updateStat();
}
function autosize(ta){ta.style.height="auto";ta.style.height=(ta.scrollHeight+2)+"px";}
function updateStat(){
  const total=SEGS.length, changed=SEGS.filter(s=>s.edited!==s.orig).length;
  const oc=SEGS.reduce((a,s)=>a+s.orig.length,0);
  const dc=SEGS.reduce((a,s)=>a+Math.abs(s.edited.length-s.orig.length),0);
  const pct=oc?Math.round(dc/oc*100):0;
  $("#stat").innerHTML=total?`<b>${changed}</b> / ${total} 항목 수정 · 변경량 ~<b>${pct}%</b> · 형식 ${MODE}`:"—";
}

/* ---------- export ---------- */
function copy(txt,msg){navigator.clipboard.writeText(txt).then(()=>toast(msg||"복사됨"),()=>toast("복사 실패 — 수동 선택"));}
function download(name,txt){const b=new Blob([txt],{type:"text/plain"});const a=el("a");a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);}
function exportEdited(){
  if(!SEGS.length)return toast("항목 없음");
  const sep=MODE==="paras"?"\n\n":"\n";
  copy(SEGS.map(s=>s.edited).join(sep),"편집본 복사됨");
}
function exportSheet(){
  if(MODE!=="sheet")return toast("시트 형식일 때만 (EN/KO). apply.py로 반영용");
  const lines=["# 윤문 에디터 내보내기 — text-tools/apply.py 로 반영","",];
  SEGS.forEach(s=>{lines.push(`[${s.id}]`,"EN\t"+s.ref,"KO\t"+s.edited,"");});
  download("portfolio_text.edited.txt",lines.join("\n"));
  toast("시트 다운로드 (apply.py 로 반영)");
}
function exportChanges(){
  const ch=SEGS.filter(s=>s.edited!==s.orig);
  if(!ch.length)return toast("변경 없음");
  const rep=["# 변경 리포트 ("+ch.length+"건)","",...ch.flatMap(s=>[`[${s.id}]`,"- "+s.orig,"+ "+s.edited,""])].join("\n");
  download("changes-report.txt",rep);toast(`변경 ${ch.length}건 리포트`);
}

/* ---------- sample ---------- */
const SAMPLE=`[001]
EN\tGenerating evidence is the easy half; the point is use.
KO\t근거를 만드는 건 절반일 뿐이다. 중요한 건 활용이다.

[002]
EN\tThe point isn't speed.
KO\t핵심은 속도가 아니다.

[003]
EN\tChange the system, not the person.
KO\t개인이 아니라 시스템을 바꾼다.`;

/* ---------- wire ---------- */
$("#loadSheet").onclick=()=>load("sheet");
$("#loadLines").onclick=()=>load("lines");
$("#loadParas").onclick=()=>load("paras");
$("#sample").onclick=()=>{$("#paste").value=SAMPLE;load("sheet",SAMPLE);};
$("#fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#paste").value=r.result;load(looksLikeSheet(r.result)?"sheet":"lines",r.result);};r.readAsText(f);};
$("#paste").addEventListener("paste",()=>setTimeout(()=>{const v=$("#paste").value;if(looksLikeSheet(v))$("#hint").textContent="EN/KO 시트로 감지됨 — 'EN/KO 시트로 불러오기'를 누르세요.";},0));
$("#diffToggle").onclick=()=>{SHOWDIFF=!SHOWDIFF;$("#sw").classList.toggle("on",SHOWDIFF);document.querySelectorAll(".diff").forEach(d=>d.classList.toggle("show",SHOWDIFF));};
$("#expEdited").onclick=exportEdited;
$("#expSheet").onclick=exportSheet;
$("#expChanges").onclick=exportChanges;

if(restore())render();
</script>
</body>
</html>
